<!DOCTYPE html>
<html lang="he" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Britavsky Team - Martial Arts</title>
<link rel="icon" href="https://www.jotform.com/uploads/YuliaSachkov/form_files/262464131302445_mainPWAIcon.6a9b0d0721d61.png">
<style>
:root{
  --accent:#E6BF00; --accent-light:#FFD400; --bg:#F0F0E0; --card:#FFFFFF;
  --text:#181818; --sub:#5a5a5a; --border:#e4e0cf;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161515; --card:#232222; --text:#f2f0e8; --sub:#bdbdbd; --border:#3a3a3a;}
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0; min-height:100%; font-family:"DM Sans","Segoe UI",Tahoma,sans-serif; color:var(--text);
  background-color:var(--bg);
  background-image:linear-gradient(rgba(240,240,224,.35),rgba(240,240,224,.35)),
    url('https://www.jotform.com/uploads/YuliaSachkov/form_files/WhatsApp%20Image%202026-09-04%20at%2019.44.41-6a9af59306d3a9.47138640.jpeg');
  background-size:cover; background-position:center; background-repeat:no-repeat; background-attachment:fixed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body{
    background-image:linear-gradient(rgba(22,21,21,.55),rgba(22,21,21,.55)),
      url('https://www.jotform.com/uploads/YuliaSachkov/form_files/WhatsApp%20Image%202026-09-04%20at%2019.44.41-6a9af59306d3a9.47138640.jpeg');
  }
}
#app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

header.hero{
  position:relative; padding-top:calc(env(safe-area-inset-top,0px) + 30px); padding-bottom:26px;
  background-color:#000;
  background-image:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.6)),
    url('https://www.jotform.com/uploads/YuliaSachkov/form_files/WhatsApp%20Image%202026-09-04%20at%2019.49.25-6a9af6dbf0a075.63442924.jpeg');
  background-size:cover; background-position:center;
  color:#fff; text-align:center; border-radius:0 0 26px 26px;
}
header.hero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:.3px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55);}
header.hero .lang-btn{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px);
  background:rgba(255,255,255,.25); border:none; color:#fff; height:38px;border-radius:19px;
  font-size:14px; cursor:pointer; font-weight:700; font-family:inherit; padding:0 14px;
}
html[dir="rtl"] header.hero .lang-btn{right:14px;}
html[dir="ltr"] header.hero .lang-btn{left:14px;}

main{flex:1; padding:16px 16px 90px; overflow-x:hidden;}
.view{display:none; animation:fade .18s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

p.intro{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px 18px; line-height:1.75; font-size:15.5px; white-space:pre-line;}
p.intro.lead{font-size:18px; font-weight:900;}
p.intro.warn{border:2px solid #E4342B; color:#E4342B; font-size:16.5px; font-weight:600; margin-top:26px;}

.card{
  display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid #9c9c94;
  border-radius:18px; padding:18px; margin-top:12px; text-decoration:none; color:var(--text); cursor:pointer;
}
.card .icon{
  width:48px;height:48px;border-radius:12px;background:#FAF5E1;color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.card .body{flex:1;}
.card .body .title{font-weight:700;font-size:16.5px;}
.card .body .desc{font-size:13.5px;color:var(--sub);margin-top:3px;}
.card .arrow{color:var(--sub);font-size:14px;}
html[dir="ltr"] .card .arrow{transform:scaleX(-1);}

h2.section{font-size:15px; margin:22px 0 8px; color:var(--text);}
hr.div{border:none;border-top:2px solid var(--accent-light); width:65%; margin:20px auto;}

.page-title{font-size:20px;font-weight:800;margin:6px 0 14px;}
.rich{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; line-height:1.85; font-size:14.5px;}
.rich.warn{border:2px solid var(--accent); background:#FFFDF0;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rich.warn{background:#2a2607;}}
.rich h3{color:var(--accent);margin:16px 0 6px;font-size:15.5px;}
.rich h3:first-child{margin-top:0;}
.rich .line{margin:2px 0;}
img.cover{width:100%;display:block;border-radius:18px;margin-top:4px;object-fit:contain;background:var(--card);}

nav.bottom{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:var(--card); border-top:1px solid var(--border);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.bottom button{
  flex:1; background:none; border:none; padding:10px 4px 8px; font-family:inherit; color:var(--sub);
  font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav.bottom button .ic{font-size:19px;}
nav.bottom button.active{color:var(--accent);}

/* Responsive: tablet / desktop */
@media (min-width:700px){
  #app{max-width:760px;}
  header.hero h1{font-size:36px;}
  main{padding:24px 32px 100px;}
  .home-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px;}
  .home-grid .card, .home-grid a.card{margin-top:0;}
  nav.bottom{max-width:760px; border-radius:20px 20px 0 0;}
}
@media (min-width:1024px){
  #app{max-width:960px;}
  main{padding:32px 60px 110px;}
}
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function () {

  function showView(v){
    document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
    var target = document.getElementById('view-' + v);
    if (target) target.classList.add('active');
    document.querySelectorAll('nav.bottom button').forEach(function(b){
      b.classList.toggle('active', b.dataset.v === v);
    });
    var main = document.querySelector('main');
    if (main) main.scrollTo(0,0);
    window.scrollTo(0,0);
  }

  var currentLang = 'he';
  function applyLang(lang){
    document.querySelectorAll('[data-he]').forEach(function(el){
      el.textContent = lang === 'ru' ? el.getAttribute('data-ru') : el.getAttribute('data-he');
    });
    var html = document.getElementById('htmlRoot');
    html.setAttribute('lang', lang === 'ru' ? 'ru' : 'he');
    html.setAttribute('dir', lang === 'ru' ? 'ltr' : 'rtl');
    document.getElementById('langBtn').textContent = lang === 'ru' ? 'עב' : 'RU';
    currentLang = lang;
  }

  // --- wire up events ---
  var langBtn = document.getElementById('langBtn');
  if (langBtn) langBtn.addEventListener('click', function(){
    applyLang(currentLang === 'he' ? 'ru' : 'he');
  });

  document.querySelectorAll('.navcard').forEach(function(el){
    el.addEventListener('click', function(){
      var target = el.getAttribute('data-target');
      if (target) showView(target);
    });
  });

  document.querySelectorAll('nav.bottom button[data-v]').forEach(function(btn){
    btn.addEventListener('click', function(){ showView(btn.dataset.v); });
  });

  applyLang('he');
});
</script>
