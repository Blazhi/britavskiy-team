<!DOCTYPE html>
<html lang="he" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Britavsky Team - Martial Arts</title>
<style>
:root{
  --accent:#E6BF00; --accent-light:#FFD400; --bg:#F0F0E0; --card:#FFFFFF;
  --text:#181818; --sub:#5a5a5a; --border:#e4e0cf;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161515; --card:#232222; --text:#f2f0e8; --sub:#bdbdbd; --border:#3a3a3a;}
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{margin:0; height:100%; font-family:"DM Sans","Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text);}
#app{max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

header.hero{
  position:relative; padding-top:calc(env(safe-area-inset-top,0px) + 26px); padding-bottom:22px;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.55)),
    linear-gradient(135deg,var(--accent-light),var(--accent));
  color:#111; text-align:center; border-radius:0 0 26px 26px;
}
header.hero .logo{
  width:78px;height:78px;border-radius:50%;background:#fff;margin:0 auto 10px;
  display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);
}
header.hero h1{margin:0;font-size:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);}
header.hero .menu-btn, header.hero .lang-btn{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px);
  background:rgba(255,255,255,.25); border:none; color:#fff; height:38px;border-radius:19px;
  font-size:14px; cursor:pointer; font-weight:700; font-family:inherit;
}
header.hero .menu-btn{width:38px; padding:0; font-size:18px;}
header.hero .lang-btn{padding:0 14px;}
html[dir="rtl"] header.hero .menu-btn{left:14px;}
html[dir="rtl"] header.hero .lang-btn{right:14px;}
html[dir="ltr"] header.hero .menu-btn{right:14px;}
html[dir="ltr"] header.hero .lang-btn{left:14px;}

main{flex:1; padding:16px 16px 90px; overflow-x:hidden;}
.view{display:none; animation:fade .18s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

p.intro{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px 16px; line-height:1.7; font-size:15px;}

.card{
  display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border);
  border-radius:18px; padding:14px; margin-top:10px; text-decoration:none; color:var(--text); cursor:pointer;
}
.card .icon{
  width:42px;height:42px;border-radius:12px;background:#FAF5E1;color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.card .body{flex:1;}
.card .body .title{font-weight:700;font-size:15px;}
.card .body .desc{font-size:12.5px;color:var(--sub);margin-top:2px;}
.card .arrow{color:var(--sub);font-size:14px;}
html[dir="ltr"] .card .arrow{transform:scaleX(-1);}

h2.section{font-size:15px; margin:22px 0 8px; color:var(--text);}
hr.div{border:none;border-top:2px solid var(--accent-light); width:65%; margin:20px auto;}

.page-title{font-size:20px;font-weight:800;margin:6px 0 14px;}
.rich{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; line-height:1.85; font-size:14.5px;}
.rich h3{color:var(--accent);margin:16px 0 6px;font-size:15.5px;}
.rich h3:first-child{margin-top:0;}
.rich .line{margin:2px 0;}
img.cover{width:100%;border-radius:18px;margin-top:4px;}

nav.bottom{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:var(--card); border-top:1px solid var(--border);
  display:flex; padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.bottom button{
  flex:1; background:none; border:none; padding:10px 4px 8px; font-family:inherit; color:var(--sub);
  font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav.bottom button .ic{font-size:19px;}
nav.bottom button.active{color:var(--accent);}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20;}
.sheet-overlay.open{display:block;}
.sheet{
  position:fixed; top:0; height:100%; width:78%; max-width:320px; background:var(--card);
  transition:transform .22s ease; z-index:21; padding:calc(env(safe-area-inset-top,0px)+20px) 18px 18px;
  overflow-y:auto;
}
html[dir="rtl"] .sheet{right:0; transform:translateX(100%);}
html[dir="ltr"] .sheet{left:0; transform:translateX(-100%);}
.sheet.open{transform:none;}
.sheet h3{margin-top:0;color:var(--accent);}
.sheet a, .sheet .mlink{display:block;padding:12px 4px;border-bottom:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14.5px;cursor:pointer;}
</style>
</head>
<body>
<div id="app">

  <header class="hero">
    <button class="menu-btn" id="menuBtn">☰</button>
    <button class="lang-btn" id="langBtn">RU</button>
    <div class="logo">🥋</div>
    <h1>Britavsky Team - Martial Arts</h1>
  </header>

  <main>
    <!-- HOME -->
    <section id="view-home" class="view active">
      <p class="intro" data-he="בריטבסקי טים הוא מועדון אימוני אומנויות לחימה קיקבוקס וקרב מגע ייחודי לילדים, נוער ובוגרים. סניף קריית מוצקין: רנ&quot;ס 35, סניף חיפה: צה&quot;ל 16." data-ru="Britavsky Team — клуб единоборств: кикбоксинг и контактный бой для детей, подростков и взрослых. Филиал Кирьят-Моцкин: ул. Ранак 35, филиал Хайфа: ул. Цахаль 16."></p>

      <a class="card" href="https://form.jotform.com/262426118520046" target="_blank" rel="noopener">
        <div class="icon">👤</div>
        <div class="body">
          <div class="title" data-he="הרשמה למועדון" data-ru="Регистрация в клуб"></div>

        <div class="arrow">‹</div>
      </div>

        </div>
        <div class="arrow">‹</div>
      </div>

      <a class="card" href="https://wa.me/message/YSFQUW77QK6SL1" target="_blank" rel="noopener">
        <div class="icon">➡️</div>
        <div class="body">
          <div class="title" data-he="קביעת אימון אישי" data-ru="Запись на персональную тренировку"></div>

        </div>

      <div class="rich" style="margin-top:12px; text-align:center; color:var(--sub);" data-he="📷 תמונת מערכת השעות" data-ru="📷 Изображение расписания"></div>
    </section>

    <!-- NEWS -->

      </div>

      <div class="card navcard" data-target="reminders">

        <div class="line" data-he="אימון קבוצתי בודד – ₪50" data-ru="Разовая групповая тренировка – 50 ₪"></div>

  <div class="mlink" data-target="reschedule" data-he="שינוי / ביטול אימון" data-ru="Изменение / отмена тренировки"></div>
  <div class="mlink" data-target="events" data-he="תחרויות ואירועים" data-ru="Соревнования и мероприятия"></div>
  <div class="mlink" data-target="reminders" data-he="תזכורות חשובות" data-ru="Важные напоминания"></div>
  <a href="https://wa.me/message/YSFQUW77QK6SL1" target="_blank" rel="noopener" data-he="צור קשר בוואטסאפ" data-ru="Связаться в WhatsApp"></a>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {

  function showView(v){
    document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
    var target = document.getElementById('view-' + v);
    if (target) target.classList.add('active');
    document.querySelectorAll('nav.bottom button').forEach(function(b){
      b.classList.toggle('active', b.dataset.v === v);
    });
    var main = document.querySelector('main');
    if (main) main.scrollTo(0,0);
    window.scrollTo(0,0);
  }

  function openMenu(open){
    document.getElementById('sheet').classList.toggle('open', open);
    document.getElementById('overlay').classList.toggle('open', open);
  }

  var currentLang = 'he';
  function applyLang(lang){
    document.querySelectorAll('[data-he]').forEach(function(el){
      el.textContent = lang === 'ru' ? el.getAttribute('data-ru') : el.getAttribute('data-he');
    });
    var html = document.getElementById('htmlRoot');
    html.setAttribute('lang', lang === 'ru' ? 'ru' : 'he');
    html.setAttribute('dir', lang === 'ru' ? 'ltr' : 'rtl');
    document.getElementById('langBtn').textContent = lang === 'ru' ? 'עב' : 'RU';
    currentLang = lang;
  }

  // --- wire up events ---
  var menuBtn = document.getElementById('menuBtn');
  if (menuBtn) menuBtn.addEventListener('click', function(){ openMenu(true); });

  var overlay = document.getElementById('overlay');
  if (overlay) overlay.addEventListener('click', function(){ openMenu(false); });

  var langBtn = document.getElementById('langBtn');
  if (langBtn) langBtn.addEventListener('click', function(){
    applyLang(currentLang === 'he' ? 'ru' : 'he');
  });

  document.querySelectorAll('.navcard, .mlink').forEach(function(el){
    el.addEventListener('click', function(){
      var target = el.getAttribute('data-target');
      if (target) showView(target);
      if (el.classList.contains('mlink')) openMenu(false);
    });
  });

  document.querySelectorAll('nav.bottom button[data-v]').forEach(function(btn){
    btn.addEventListener('click', function(){ showView(btn.dataset.v); });
  });

  applyLang('he');
});
</script>
</body>
</html>
